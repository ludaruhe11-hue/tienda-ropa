<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - Venta de Ropa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Mi Tienda de Ropa</h1>
        <div class="header-right">
            <span>Hola, {{ usuario }} 👋</span>
            <a href="/logout" class="btn-logout">Cerrar sesión</a>
            <span id="carrito-contador" class="carrito">🛒 Carrito: 0</span>
        </div>
    </header>
    <main class="tienda-main">
        <h2>Colección 2026</h2>
        <div class="productos-grid">
            {% for p in productos %}
            <div class="card">
                <img src="{{ p.img }}" alt="{{ p.nombre }}">
                <h3>{{ p.nombre }}</h3>
                <p class="precio">${{ p.precio }} MXN</p>
                <button class="btn-comprar" onclick="agregarCarrito('{{ p.nombre }}', {{ p.precio }})">Agregar al carrito</button>
            </div>
            {% endfor %}
        </div>
    </main>
    <script>
        let carrito = 0;
        let total = 0;
        function agregarCarrito(nombre, precio){
            carrito++;
            total += precio;
            document.getElementById('carrito-contador').innerText = `🛒 Carrito: ${carrito} ($${total})`;
            alert(`¡Agregaste "${nombre}"!`);
        }
    </script>
</body>
</html>
